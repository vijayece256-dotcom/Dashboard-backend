openapi: 3.0.3
info:
  title: Balnus Backend API
  version: 1.0.0
  description: OpenAPI specification for the Balnus health, employee, authentication, team, designation, project, feature, comment, and activity endpoints.
servers:
  - url: https://balnus-backend.onrender.com
    description: Render deployment
  - url: http://localhost:8000
    description: Local development server
tags:
  - name: Health
  - name: Authentication
  - name: Employee
  - name: Team
  - name: Designation
  - name: Project
  - name: Comments
  - name: Project Activity
  - name: Feature
paths:
  /api/v1/feature:
    get:
      tags: [Feature]
      summary: List features
      description: Admin access is required.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Feature list returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feature'
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
    post:
      tags: [Feature]
      summary: Create a feature
      description: Admin access is required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [featureName, featureCode]
              properties:
                featureName:
                  type: string
                  maxLength: 150
                  example: Dashboard
                featureCode:
                  type: string
                  maxLength: 100
                  example: DASHBOARD
      responses:
        '201':
          description: Feature created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
        '400':
          description: Feature fields are missing or invalid.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
        '409':
          description: featureCode already exists.
  /api/healthCheck:
    get:
      tags: [Health]
      summary: Check API health
      responses:
        '200':
          description: API is responding.
          content:
            text/html:
              schema:
                type: string
              example: data
  /api/swagger:
    get:
      tags: [Health]
      summary: Open interactive API documentation
      description: Displays the Swagger UI for this API.
      responses:
        '200':
          description: Swagger UI page returned.
          content:
            text/html:
              schema:
                type: string
        '500':
          description: Swagger UI could not be rendered.
  /api/v1/employee:
    get:
      tags: [Employee]
      summary: List employees
      description: Admin access is required. team, designation, and projectId filters are optional and ignored when empty. Set isAccountPage=true to return account fields; false or omitted returns employee list fields.
      security:
        - bearerAuth: []
      parameters:
        - name: team
          in: query
          required: false
          schema:
            type: string
          description: Team name; the matching team's ID is used to filter employees by teamId.
        - name: designation
          in: query
          required: false
          schema:
            type: string
          description: Designation name; matching designation IDs are used to filter employees by designationId.
        - name: projectId
          in: query
          required: false
          schema:
            type: string
          description: MongoDB project ID or generated projectID (for example PRJ-1001); returns employees assigned to the project.
        - name: isAccountPage
          in: query
          required: false
          schema:
            type: boolean
          description: When true, returns firstName, lastname, email, isActive, and featureAccess containing feature names. When false or omitted, returns employeeCode, firstname, lastname, team, designation, isStatus, and email.
      responses:
        '200':
          description: Employee list.
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/EmployeeAccountListItem'
                    - $ref: '#/components/schemas/EmployeeListItem'
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
    post:
      tags: [Employee]
      summary: Create an employee
      description: Admin access is required. teamId and designationId are optional; supplied references must be active, and a supplied designation must belong to teamId when teamId is also supplied.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '201':
          description: Employee created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeWriteResponse'
        '400':
          description: Request fields failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: employee_code, emailaddress, or phonenumber already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
  /api/v1/employee/{employeeId}:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
    get:
      tags: [Employee]
      summary: Get an employee by ID
      description: Admin access is required. Returns all employee fields except the password, including featureAccess when set.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Employee returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeWriteResponse'
        '400':
          description: Invalid employee ID.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
        '404':
          description: Employee not found.
    patch:
      tags: [Employee]
      summary: Activate or deactivate an employee
      description: Admin access is required. Set isActive to true to activate the employee or false to deactivate them.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive:
                  type: boolean
      responses:
        '200':
          description: Employee status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeWriteResponse'
        '400':
          description: Invalid employee ID or isActive value.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
        '404':
          description: Employee not found.
    put:
      tags: [Employee]
      summary: Update an employee
      description: Admin access is required. Change passwords through PUT /api/v1/auth/password.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
      responses:
        '200':
          description: Employee updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeWriteResponse'
        '400':
          description: Invalid employee ID, employee fields, or team/designation reference.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
        '404':
          description: Employee not found.
        '409':
          description: Username, emailaddress, or phonenumber already exists.
    delete:
      tags: [Employee]
      summary: Delete an employee
      description: Admin access is required. This permanently deletes the employee and revokes their active access and refresh tokens.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Employee deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Employee deleted successfully
        '400':
          description: Invalid employee ID.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
        '404':
          description: Employee not found.
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access tokens last 5 minutes when isPermanentPassword is false and 30 minutes when it is true. Successful login returns a profile; temporary-password login also returns NEW_PASSWORD_REQUIRED and employeeId. Successful login revokes the customer's previous access and refresh tokens.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/NewPasswordRequiredResponse'
        '401':
          description: Emailaddress or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: The customer account is inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/v1/auth/password:
    put:
      tags: [Authentication]
      summary: Set or change the customer password
      description: Requires a bearer access token from login and a new password longer than 8 characters containing an uppercase letter, a number, and a special character. The customer ID is read from the verified token. Updating the password revokes previous access and refresh tokens.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: Password updated; a new token pair was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request fields or new password does not meet requirements.
        '401':
          description: Access token is invalid or expired.
        '403':
          description: The account is inactive.
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate the refresh token
      description: Revokes the presented refresh token and returns a new token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refresh succeeded; the previous refresh token is revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refresh token is missing, invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out the current session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Logged out successfully
        '401':
          description: Access token is missing, invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/v1/team:
    get:
      tags: [Team]
      summary: List teams
      description: Admin access is required.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Teams ordered by teamName.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '401':
          description: Access token is missing, invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    post:
      tags: [Team]
      summary: Create a team
      description: Admin access is required. Team names are unique without regard to letter case.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        '201':
          description: Team created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Invalid request fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Access token is missing, invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Admin access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: A team with this name already exists, ignoring case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/v1/team-designation:
    get:
      tags: [Team, Designation]
      summary: List teams and designations
      description: Admin access is required. Returns separate teams and designations arrays. Set isAnalytics=true to include overall and per-item counts.
      security:
        - bearerAuth: []
      parameters:
        - name: isAnalytics
          in: query
          required: false
          schema:
            type: boolean
          description: When true, includes totalTeams, totalDesignation, each team's totalDesignationCount, and each designation's totalEmployeeCount.
      responses:
        '200':
          description: Teams and designations returned.
          content:
            application/json:
              schema:
                type: object
                required: [teams, designations]
                properties:
                  totalTeams:
                    type: integer
                  totalDesignation:
                    type: integer
                  teams:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/NamedActiveItem'
                        - type: object
                          properties:
                            totalDesignationCount:
                              type: integer
                  designations:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/NamedActiveItem'
                        - type: object
                          properties:
                            totalEmployeeCount:
                              type: integer
        '400':
          description: isAnalytics must be true or false.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
    post:
      tags: [Team, Designation]
      summary: Create a team and designation
      description: Admin access is required. Creates an active team and an active designation linked to it. Team names are globally unique without regard to letter case; designation names are unique within a team without regard to letter case.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamName, designationName]
              properties:
                teamName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Platform
                designationName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Engineer
      responses:
        '201':
          description: Team and designation created, both active.
          content:
            application/json:
              schema:
                type: object
                required: [team, designation]
                properties:
                  team:
                    $ref: '#/components/schemas/Team'
                  designation:
                    $ref: '#/components/schemas/Designation'
        '400':
          description: Invalid request fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Access token is missing, invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Admin access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Team name already exists (ignoring case), or the designation name conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/v1/team/{teamId}:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
    get:
      tags: [Team]
      summary: Get a team by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Team found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Invalid team ID.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '404':
          description: Team not found.
    put:
      tags: [Team]
      summary: Replace a team
      description: Admin access is required. Both teamName and isActive are mandatory.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        '200':
          description: Team updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Invalid team ID or request fields.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
        '404':
          description: Team not found.
        '409':
          description: Another team already uses this name, ignoring case.
    delete:
      tags: [Team]
      summary: Delete a team
      description: Admin access is required. This permanently deletes the team.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Team deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid team ID.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
        '404':
          description: Team not found.
  /api/v1/team/designation:
    get:
      tags: [Designation]
      summary: List designations
      description: Admin access is required. Designations are ordered by name.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Designations ordered by name, including the name of each linked team.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DesignationWithTeam'
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
  /api/v1/team/{teamId}/designation:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
    post:
      tags: [Designation]
      summary: Create a designation for a team
      description: Admin access is required. The team ID is taken from the path. Names must be unique within a team, ignoring case.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignationInput'
      responses:
        '201':
          description: Designation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Designation'
        '400':
          description: Invalid team ID or request fields.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
        '404':
          description: Team not found.
        '409':
          description: This team already has a designation with this name.
  /api/v1/team/{teamId}/designation/{designationId}:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
      - name: designationId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
    put:
      tags: [Designation]
      summary: Replace a team's designation
      description: Admin access is required. Both name and isActive are mandatory. The designation is assigned to the team in the path; its teamId is updated.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignationInput'
      responses:
        '200':
          description: Designation updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Designation'
        '400':
          description: Invalid team ID, designation ID, or request fields.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
        '404':
          description: Team or designation not found.
        '409':
          description: This team already has a designation with this name.
    delete:
      tags: [Designation]
      summary: Delete a team's designation
      description: Admin access is required. The designation must belong to the team in the path.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Designation deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid team ID or designation ID.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
        '404':
          description: Team or designation not found for this team.
  /api/v1/project:
    get:
      tags: [Project]
      summary: List projects
      description: Admin access is required. Set isAnalytics=true to return the total project count and counts by status; otherwise returns the project list.
      security:
        - bearerAuth: []
      parameters:
        - name: isAnalytics
          in: query
          required: false
          schema:
            type: boolean
          description: When true, returns totalProject and counts for InProgress, OnHold, Completed, and Upcoming.
      responses:
        '200':
          description: Project list or status analytics, depending on isAnalytics.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProjectListResponse'
                  - $ref: '#/components/schemas/ProjectAnalytics'
        '400':
          description: isAnalytics must be true or false.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
    post:
      tags: [Project]
      summary: Create a project
      description: Admin access is required. projectID is generated by the server. projectName is unique without regard to letter case.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid fields or references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
        '409':
          description: A project with this name already exists, ignoring case.
  /api/v1/project/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
    get:
      tags: [Project]
      summary: Get a project by MongoDB _id
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project found with its team _id and teamName nested under team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetails'
        '400':
          description: Invalid project ID.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
        '404':
          description: Project not found.
    put:
      tags: [Project]
      summary: Edit a project
      description: Admin access is required. projectID is immutable and generated by the server.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Project updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid project ID, fields, or references.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
        '404':
          description: Project not found.
        '409':
          description: Another project already uses this name, ignoring case.
    delete:
      tags: [Project]
      summary: Delete a project
      description: Admin access is required. This permanently deletes the project.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Project deleted successfully
        '400':
          description: Invalid project ID.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
        '404':
          description: Project not found.
  /api/v1/project/{projectId}/comments:
    parameters:
      - name: projectId
        in: path
        required: true
        description: MongoDB project _id or generated projectID such as PRJ-1001.
        schema:
          type: string
    get:
      tags: [Comments]
      summary: List comments for a project
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Comments with author ID and name under employeeDetails.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectComment'
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin or employee access is required.
        '404':
          description: Project not found.
    post:
      tags: [Comments]
      summary: Add a comment to a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCommentInput'
      responses:
        '201':
          description: Comment created. Author ID is taken from the access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectComment'
        '400':
          description: Invalid comment payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin or employee access is required.
        '404':
          description: Project not found.
  /api/v1/project/{projectId}/comments/{commentId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: MongoDB project _id or generated projectID such as PRJ-1001.
        schema:
          type: string
      - name: commentId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
    put:
      tags: [Comments]
      summary: Update a project comment
      description: Only the authenticated user who created the comment can update it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCommentInput'
      responses:
        '200':
          description: Comment updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectComment'
        '400':
          description: Invalid comment or ID.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin or employee access is required.
        '404':
          description: Project or comment not found.
    delete:
      tags: [Comments]
      summary: Delete a project comment
      description: Only the authenticated user who created the comment can delete it.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Comment deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Comment deleted successfully
        '400':
          description: Invalid comment ID.
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin or employee access is required.
        '404':
          description: Project or comment not found.
  /api/v1/project/{projectId}/activities:
    parameters:
      - name: projectId
        in: path
        required: true
        description: MongoDB project _id or generated projectID such as PRJ-1001.
        schema:
          type: string
    get:
      tags: [Project Activity]
      summary: List project activity history
      description: Admin access only. Includes project create, edit, delete, and comment add, edit, and delete events.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Activity history sorted newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectActivity'
        '401':
          description: Access token is missing, invalid, expired, or revoked.
        '403':
          description: Admin access is required.
        '404':
          description: Project not found.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Feature:
      type: object
      required: [_id, featureName, featureCode]
      properties:
        _id:
          type: string
        featureName:
          type: string
        featureCode:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectActivity:
      type: object
      required: [_id, projectId, projectID, actorRole, action, message, changedFields, actorDetails, createdAt]
      properties:
        _id:
          type: string
        projectId:
          type: string
          description: MongoDB _id of the project.
        projectID:
          type: string
          example: PRJ-1001
        actorRole:
          type: string
          enum: [admin, employee]
        action:
          type: string
          enum: [PROJECT_CREATED, PROJECT_UPDATED, PROJECT_DELETED, COMMENT_ADDED, COMMENT_UPDATED, COMMENT_DELETED]
        message:
          type: string
        changedFields:
          type: array
          items:
            $ref: '#/components/schemas/ProjectFieldChange'
        commentText:
          type: string
        actorDetails:
          type: object
          nullable: true
          properties:
            actorId:
              type: string
            actorName:
              type: string
            role:
              type: string
              enum: [admin, employee]
        createdAt:
          type: string
          format: date-time
    ProjectFieldChange:
      type: object
      required: [field]
      properties:
        field:
          type: string
        previousValue: {}
        newValue: {}
    ProjectCommentInput:
      type: object
      additionalProperties: false
      required: [comments]
      properties:
        comments:
          type: string
          minLength: 1
          maxLength: 5000
          example: Initial requirements review is complete.
    ProjectComment:
      type: object
      required: [_id, projectId, comments, employeeDetails, createdAt, updatedAt]
      properties:
        _id:
          type: string
        projectId:
          type: string
          description: MongoDB _id of the project.
        comments:
          type: string
        employeeDetails:
          type: object
          required: [employeeId, employeeName]
          properties:
            employeeId:
              type: string
              description: MongoDB _id of the authenticated author.
            employeeName:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectInput:
      type: object
      required: [projectName, projectOwner, teamId]
      properties:
        projectName:
          type: string
          minLength: 1
          maxLength: 150
          example: Customer Portal
        clientName:
          type: string
          maxLength: 150
        projectOwner:
          type: string
          minLength: 1
          maxLength: 150
          description: Project owner name or label.
        department:
          type: string
          maxLength: 100
        teamId:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
          description: MongoDB _id of an active team.
        startDate:
          type: string
          format: date-time
        expectedEndDate:
          type: string
          format: date-time
        assignedEmployees:
          type: array
          items:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          description: MongoDB IDs of active employee accounts.
        status:
          type: string
          enum: [Upcoming, InProgress, Completed, OnHold]
          default: Upcoming
        description:
          type: string
          maxLength: 5000
    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectInput'
        - type: object
          required: [projectID, createdAt, updatedAt]
          properties:
            projectID:
              type: string
              readOnly: true
              example: PRJ-1001
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ProjectListResponse:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectListItem'
    ProjectAnalytics:
      type: object
      required: [totalProject, InProgress, OnHold, Completed, Upcoming, projects]
      properties:
        totalProject:
          type: integer
        InProgress:
          type: integer
        OnHold:
          type: integer
        Completed:
          type: integer
        Upcoming:
          type: integer
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectListItem'
    ProjectListItem:
      type: object
      required: [_id, projectID, projectName, projectOwner, team, status]
      properties:
        _id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        projectID:
          type: string
          example: PRJ-1001
        projectName:
          type: string
        clientName:
          type: string
        projectOwner:
          type: string
        team:
          $ref: '#/components/schemas/TeamReference'
        startDate:
          type: string
          format: date-time
        expectedEndDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [Upcoming, InProgress, Completed, OnHold]
    ProjectDetails:
      type: object
      required: [_id, projectID, projectName, projectOwner, team, assignedEmployees, status, createdAt, updatedAt]
      properties:
        _id:
          type: string
        projectID:
          type: string
        projectName:
          type: string
        clientName:
          type: string
        projectOwner:
          type: string
        department:
          type: string
        team:
          $ref: '#/components/schemas/TeamReference'
        startDate:
          type: string
          format: date-time
        expectedEndDate:
          type: string
          format: date-time
        assignedEmployees:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [Upcoming, InProgress, Completed, OnHold]
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NamedActiveItem:
      type: object
      required: [_id, name, isActive]
      properties:
        _id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        name:
          type: string
        isActive:
          type: boolean
    TeamReference:
      type: object
      required: [_id, teamName]
      properties:
        _id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        teamName:
          type: string
    TeamInput:
      type: object
      required: [teamName, isActive]
      properties:
        teamName:
          type: string
          minLength: 1
          maxLength: 100
          example: Platform Engineering
        isActive:
          type: boolean
          example: true
    Team:
      allOf:
        - $ref: '#/components/schemas/TeamInput'
        - type: object
          required: [_id, createdAt, updatedAt]
          properties:
            _id:
              type: string
              example: 665f2d4e3b30ca7bd064d912
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    DesignationInput:
      type: object
      required: [name, isActive]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Engineering Manager
        isActive:
          type: boolean
          example: true
    Designation:
      allOf:
        - $ref: '#/components/schemas/DesignationInput'
        - type: object
          required: [_id, teamId, createdAt, updatedAt]
          properties:
            _id:
              type: string
              example: 665f2d4e3b30ca7bd064d912
            teamId:
              type: string
              pattern: '^[a-fA-F0-9]{24}$'
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    DesignationWithTeam:
      type: object
      required: [_id, name, isActive, team, createdAt, updatedAt]
      properties:
        _id:
          type: string
          example: 665f2d4e3b30ca7bd064d912
        name:
          type: string
          example: Engineering Manager
        isActive:
          type: boolean
          example: true
        team:
          type: object
          required: [_id, teamName, isActive]
          properties:
            _id:
              type: string
              pattern: '^[a-fA-F0-9]{24}$'
            teamName:
              type: string
              example: Platform
            isActive:
              type: boolean
              example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EmployeeFields:
      type: object
      required: [firstName, lastName, emailaddress, isActive]
      properties:
        employee_code:
          type: string
          minLength: 1
          maxLength: 30
          pattern: '^[A-Za-z0-9-]{1,30}$'
          example: BF-002
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Za-z]{1,50}$'
          example: Alex
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Za-z]{1,50}$'
          example: Kumar
        phonenumber:
          type: string
          minLength: 1
          maxLength: 10
          pattern: '^\d{1,10}$'
          description: Send as a string to preserve leading zeroes.
          example: '0123456789'
        emailaddress:
          type: string
          format: email
          pattern: '^[A-Z0-9.!#$%&''*+/=?^_`{|}~-]+@[A-Z0-9-]+(?:\.[A-Z0-9-]+)*\.com$'
          example: alex@example.com
        teamId:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        designationId:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        isActive:
          type: boolean
          example: true
        featureAccess:
          type: array
          items:
            type: string
          description: Feature codes must exist in the Feature collection.
          example: [BF-002]
        isReportingManager:
          type: boolean
        manager_id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
    EmployeeRequest:
      allOf:
        - $ref: '#/components/schemas/EmployeeFields'
        - type: object
          required: [password, userType]
          properties:
            userType:
              type: string
              enum: [employee]
            password:
              type: string
              minLength: 8
              maxLength: 128
              format: password
              writeOnly: true
    EmployeeUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/EmployeeFields'
        - type: object
          required: [employee_code, phonenumber]
    EmployeeWriteResponse:
      type: object
      required: [_id, firstName, lastName, emailaddress, userType, isActive, isPermanentPassword]
      properties:
        _id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        employee_code:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phonenumber:
          type: string
        emailaddress:
          type: string
          format: email
        userType:
          type: string
          enum: [employee]
        teamId:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        designationId:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        isActive:
          type: boolean
        isPermanentPassword:
          type: boolean
        featureAccess:
          type: array
          items:
            type: string
        isReportingManager:
          type: boolean
        manager_id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EmployeeListItem:
      type: object
      required: [employeeCode, firstname, lastname, team, designation, isStatus, email]
      properties:
        employeeCode:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
          format: email
        isStatus:
          type: boolean
        team:
          type: object
          nullable: true
          properties:
            _id:
              type: string
            teamName:
              type: string
        designation:
          type: object
          nullable: true
          properties:
            _id:
              type: string
            designationName:
              type: string
    EmployeeAccountListItem:
      type: object
      required: [_id, firstName, lastname, email, isActive, isPermanentPassword, featureAccess]
      properties:
        _id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        firstName:
          type: string
        lastname:
          type: string
        email:
          type: string
          format: email
        isActive:
          type: boolean
        isPermanentPassword:
          type: boolean
        featureAccess:
          type: array
          items:
            type: string
          description: Feature names corresponding to the employee's feature codes.
    LoginRequest:
      type: object
      required: [emailaddress, password]
      properties:
        emailaddress:
          type: string
          format: email
          example: alex@example.com
        password:
          type: string
          format: password
          writeOnly: true
    PasswordChangeRequest:
      type: object
      required: [newPassword, confirmPassword]
      properties:
        newPassword:
          type: string
          minLength: 9
          maxLength: 128
          pattern: '^(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{9,128}$'
          format: password
          writeOnly: true
        confirmPassword:
          type: string
          minLength: 9
          maxLength: 128
          format: password
          writeOnly: true
    NewPasswordRequiredResponse:
      allOf:
        - $ref: '#/components/schemas/LoginResponse'
        - type: object
          required: [message, employeeId]
          properties:
            message:
              type: string
              enum: [NEW_PASSWORD_REQUIRED]
            employeeId:
              type: string
              pattern: '^[a-fA-F0-9]{24}$'
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenResponse'
        - type: object
          required: [profile]
          properties:
            profile:
              $ref: '#/components/schemas/LoginProfile'
    LoginProfile:
      type: object
      required: [userType, firstname, lastname, phonenumber, email, team, designation, featureAccess]
      properties:
        userType:
          type: string
          enum: [admin, employee]
        firstname:
          type: string
        lastname:
          type: string
        phonenumber:
          type: string
          nullable: true
        email:
          type: string
          format: email
        team:
          type: object
          nullable: true
          properties:
            _id:
              type: string
            name:
              type: string
        designation:
          type: object
          nullable: true
          properties:
            _id:
              type: string
            name:
              type: string
        featureAccess:
          type: array
          items:
            type: string
          description: Feature names corresponding to the employee's feature codes.
    RefreshRequest:
      type: object
      required: [refreshtoken]
      properties:
        refreshtoken:
          type: string
          description: Current refresh token. It is revoked after successful use.
    TokenResponse:
      type: object
      required: [token, refreshtoken, expiresIn, expiresAt, refreshExpiresAt]
      properties:
        token:
          type: string
          description: Bearer access token.
        refreshtoken:
          type: string
          description: Refresh token; valid for one day and rotated on use.
        expiresIn:
          type: integer
          description: Access-token lifetime in seconds.
          example: 1800
        expiresAt:
          type: string
          format: date-time
        refreshExpiresAt:
          type: string
          format: date-time
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: Validation failed
        errors:
          type: object
          additionalProperties:
            type: string
